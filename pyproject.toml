[project]
name = "pyharnx"
version = "0.2.0"
description = "A minimal agent harness in Python, built for experiments — a lightweight alternative to pi"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liyan Xu" }]
keywords = ["agents", "llm", "agent harness", "experiments", "research", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "prompt-toolkit>=3.0",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "rich>=13.0",
]

[project.scripts]
pyharnx = "pyharnx.cli.main:main"

[project.urls]
Repository = "https://github.com/lxucs/pyharnx"
Documentation = "https://github.com/lxucs/pyharnx/tree/main/docs"
Issues = "https://github.com/lxucs/pyharnx/issues"

[project.optional-dependencies]
ddgs = [
    "ddgs>=9.16.0",
]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.14", "pyright>=1.1.400"]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pyharnx"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["pyharnx", "tests", "examples", "search_agent", "img"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
